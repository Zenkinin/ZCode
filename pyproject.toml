[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zcode-agent"
version = "0.1.0"
description = "A lightweight, self-built local coding agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.6.0",
  "openai>=1.60.0",
  "prompt-toolkit>=3.0.48",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
zcode = "zcode.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["zcode"]
